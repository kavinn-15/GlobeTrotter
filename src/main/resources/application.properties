# Server
server.port=8080

# MySQL datasource
# Create the database first, e.g.:  CREATE DATABASE loginappdb;
spring.datasource.url=jdbc:mysql://localhost:3306/travelplanning
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=sql123

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# File upload limits (profile photo)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Thymeleaf (disable caching while developing)
spring.thymeleaf.cache=false

