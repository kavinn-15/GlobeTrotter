<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build Itinerary</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/build-itinerary.css}">
</head>
<body>
<div class="app-frame">
    <div class="topbar">
        <a class="app-title-link" th:href="@{/home}">GlobalTrotter</a>
        <a class="icon-circle" th:href="@{/profile}" title="Profile"></a>
    </div>


    <div id="sections">
        <div class="itinerary-section" th:each="i : ${#numbers.sequence(1, 3)}">
            <h3 th:text="'Section ' + ${i} + ':'"></h3>
            <p>
                All the necessary information about this section.
                This can be anything like trave section, hotel or any other activity
            </p>
            <div class="itinerary-row">
                <input class="field" type="text" placeholder="Date RAnge:  xxx to yyy">
                <input class="field" type="text" placeholder="Budget of this section">
            </div>
        </div>
    </div>

    <div class="add-section-row">
        <button class="btn-outline" type="button" id="addSectionBtn">+ Add another Section</button>
    </div>

    <div class="finish-row">
        <a class="btn" th:href="@{/trips/view}">View Itinerary &amp; Budget &rarr;</a>
    </div>
</div>

<script>
    (function () {
        var sectionCount = document.querySelectorAll('.itinerary-section').length;
        var wrapper = document.getElementById('sections');

        document.getElementById('addSectionBtn').addEventListener('click', function () {
            sectionCount++;

            var section = document.createElement('div');
            section.className = 'itinerary-section';
            section.innerHTML =
                '<button type="button" class="remove-section">Remove</button>' +
                '<h3>Section ' + sectionCount + ':</h3>' +
                '<p>All the necessary information about this section. ' +
                'This can be anything like trave section, hotel or any other activity</p>' +
                '<div class="itinerary-row">' +
                '<input class="field" type="text" placeholder="Date RAnge:  xxx to yyy">' +
                '<input class="field" type="text" placeholder="Budget of this section">' +
                '</div>';

            wrapper.appendChild(section);

            section.querySelector('.remove-section').addEventListener('click', function () {
                section.remove();
            });
        });
    })();
</script>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
