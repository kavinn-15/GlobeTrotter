<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create a new Trip</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/create-trip.css}">
</head>
<body>
<div class="app-frame">
    <div class="topbar">
        <span class="app-title">GlobalTrotter</span>
        <a class="icon-circle" th:href="@{/logout}" title="Logout"></a>
    </div>

    <h2 class="screen-title">Create a new Trip&nbsp;&nbsp;(Screen 4)</h2>

    <div class="panel-title">Plan a new trip</div>

    <form th:action="@{/trips/new}" method="post">
        <div class="form-panel">
            <div class="form-row">
                <label>Start Date:</label>
                <input class="field" type="date" name="searchStartDate">
            </div>
            <div class="form-row">
                <label>Select a Place :</label>
                <input class="field" type="text" name="place" placeholder="Search a place">
            </div>
            <div class="form-row">
                <label>Start Date:</label>
                <input class="field" type="date" name="startDate">
            </div>
            <div class="form-row">
                <label>End Date:</label>
                <input class="field" type="date" name="endDate">
            </div>
        </div>

        <div class="section-label">Suggestion for Places to Visit/Activites to preform</div>
        <div class="suggestion-grid">
            <div class="tile" th:each="i : ${#numbers.sequence(1, 6)}"></div>
        </div>

        <div class="submit-row">
            <button class="btn" type="submit">Build Itinerary &rarr;</button>
        </div>
    </form>
</div>
</body>
</html>
