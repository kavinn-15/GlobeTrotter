<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="stylesheet" th:href="@{/css/forgot-password.css}">
</head>
<body>
<div>

    <div class="card login-card forgot-card">

        <div class="photo-circle forgot-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="40" height="40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5v-11Z"
                      stroke="currentColor" stroke-width="1.4"/>
                <path d="m4.5 6 7.5 6 7.5-6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <div class="screen-title">Forgot Password</div>

        <p class="forgot-copy">
            Enter the email address on your account and we'll send a 6-digit
            verification code to reset your password.
        </p>

        <div th:if="${forgotError}" class="alert alert-error" role="alert" th:text="${forgotError}"></div>

        <form th:action="@{/forgot-password}" method="post">
            <label class="sr-only" for="email">Email Address</label>
            <input class="field" id="email" type="email" name="email" placeholder="Registered Email Address"
                   autocomplete="email" required autofocus>

            <button class="btn" type="submit">Send Verification Code</button>
        </form>

        <div class="link-row">
            <a th:href="@{/login}">&larr; Back to login</a>
        </div>
    </div>
</div>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
