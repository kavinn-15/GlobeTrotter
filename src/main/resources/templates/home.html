<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GlobalTrotter</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>
<div class="app-frame">
    <div class="topbar">

        
        <span class="app-title">GlobalTrotter</span>
        <a class="icon-circle" th:href="@{/logout}" title="Logout"></a>
    </div>

    <h2 class="screen-title">Main Landing Page&nbsp;&nbsp;(Screen 3)</h2>

    <div class="banner">Banner Image</div>

    <div class="toolbar">
        <input class="field search-field" type="text" placeholder="Search for .....">
        <button class="btn-outline" type="button">Group by</button>
        <button class="btn-outline" type="button">Filter</button>
        <button class="btn-outline" type="button">Sort by...</button>
    </div>

    <div class="section-label">Top Regional Selections</div>
    <div class="tile-row">
        <div class="tile" th:each="i : ${#numbers.sequence(1, 5)}"></div>
    </div>

    <div class="section-label">Previous Trips</div>
    <div class="tile-row">
        <div class="tile tile-tall" th:each="i : ${#numbers.sequence(1, 3)}"></div>
    </div>

    <div class="plan-trip-row">
        <a class="btn" th:href="@{/trips/new}">+ Plan a trip</a>
    </div>
</div>
</body>
</html>
