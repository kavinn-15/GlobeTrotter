<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="stylesheet" th:href="@{/css/forgot-password.css}">
</head>
<body>
<div>

    <div class="card login-card forgot-card">

        <div class="photo-circle forgot-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="38" height="38" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="4" y="10" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.4"/>
                <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
        </div>

        <div class="screen-title">Set a New Password</div>

        <p class="forgot-copy" th:if="${otpVerifiedMessage}" th:text="${otpVerifiedMessage}">Code verified.</p>

        <div th:if="${resetError}" class="alert alert-error" role="alert" th:text="${resetError}"></div>

        <form th:action="@{/reset-password}" method="post">
            <label class="sr-only" for="password">New Password</label>
            <input class="field" id="password" type="password" name="password" placeholder="New Password"
                   autocomplete="new-password" minlength="4" required autofocus>

            <label class="sr-only" for="confirmPassword">Confirm New Password</label>
            <input class="field" id="confirmPassword" type="password" name="confirmPassword" placeholder="Confirm New Password"
                   autocomplete="new-password" minlength="4" required>

            <button class="btn" type="submit">Reset Password</button>
        </form>

        <div class="link-row">
            <a th:href="@{/login}">&larr; Back to login</a>
        </div>
    </div>
</div>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
